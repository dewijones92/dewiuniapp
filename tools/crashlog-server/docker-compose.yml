# Deliberately its own compose project rather than an entry in the Pi's main stack:
# bringing the crash sink up or down must never restart nginx, Jellyfin or the VPN
# containers. nginx reaches it over host.docker.internal, the same way
# graidentestdev already does.
services:
  crashlog:
    build: .
    # The Pi's nginx resolves this service BY CONTAINER NAME (`set $crashlog …` in
    # data/nginx/app.conf), so this name and that config must change together or the
    # live sink 502s. Both were renamed in lockstep on 2026-07-25.
    image: totum-crashlog:local
    container_name: totum-crashlog
    restart: unless-stopped
    # No published host port at all. The container joins nginx's own docker network,
    # so nginx reaches it by container name and nothing is exposed to the LAN. (A
    # loopback-published port would NOT work: nginx resolves host.docker.internal to
    # the bridge gateway, which cannot reach a service bound to the host's 127.0.0.1.)
    networks:
      - bin_private
    volumes:
      # Bind-mounted so reports are readable over plain SSH with cat, even if this
      # container is down.
      - /home/pi/crashlog-data:/data
    environment:
      CRASHLOG_MAX_TOTAL_MB: "512"

# Created by the Pi's main server stack; joined rather than recreated so this project
# can be restarted independently of it.
networks:
  bin_private:
    external: true
