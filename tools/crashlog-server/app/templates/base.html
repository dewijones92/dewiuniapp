<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}UniApp crash log{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --line: color-mix(in srgb, currentColor 15%, transparent); }
    body { font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 1.5rem; }
    h1 { font-size: 1.3rem; margin: 0 0 1rem; }
    h2 { font-size: 1rem; margin: 1.75rem 0 .5rem; }
    a { color: inherit; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; opacity: .7; }
    tr:hover td { background: color-mix(in srgb, currentColor 5%, transparent); }
    code, pre { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; }
    pre { overflow-x: auto; padding: .8rem; border: 1px solid var(--line); border-radius: 6px; }
    .muted { opacity: .6; }
    .chip { display: inline-block; padding: .1rem .4rem; border: 1px solid var(--line); border-radius: 999px; font-size: .75rem; }
    form { margin: 0 0 1rem; display: flex; gap: .5rem; flex-wrap: wrap; }
    input { font: inherit; padding: .35rem .5rem; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
    .timeline { list-style: none; padding: 0; margin: 0; }
    .timeline li { padding: .3rem 0; border-bottom: 1px solid var(--line); display: flex; gap: .75rem; }
    .timeline time { white-space: nowrap; opacity: .6; font-family: ui-monospace, monospace; font-size: 12px; }
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
