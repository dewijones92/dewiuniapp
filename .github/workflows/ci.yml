name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-sponsorblock:
    name: SponsorBlock removal (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg + yt-dlp
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python3 -m pip install "yt-dlp==2026.6.9"
      - name: Verify SponsorBlock segments are cut from downloads
        run: python3 tools/sponsorblock-verify/verify_sponsorblock_cut.py

  verify-mock-youtube:
    name: Mock YouTube replay (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install yt-dlp + mitmproxy (pinned to the cassette's recording versions)
        run: python3 -m pip install "yt-dlp==2026.6.9" "mitmproxy==12.2.2"
      - name: Replay cassette and verify offline extraction
        run: tools/mock-youtube/verify_replay.sh

  # The 46 instrumented tests were COMPILED by the gate and never run — no emulator existed
  # here. That is the gap that let three autoplay bugs ship in one week: each passed the JVM
  # suite because every component was correct against its fake, and only a real player reaching
  # the real end of real media exercises the composition where all three lived. A guard that
  # only runs when someone remembers to run it is not a guard.
  #
  # Deliberately its own job, and deliberately NOT a dependency of the release. An emulator is
  # the flakiest thing in any Android pipeline, and Dewi installs from these releases through
  # Obtainium — blocking his APK on a flaky VM would trade a real problem for a worse one. It
  # goes red and is seen; it does not stop a build shipping.
  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Without KVM the emulator falls back to software rendering and is far too slow to finish.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # The loop test needs audio focus, which the platform refuses to a background app or a
          # locked screen — and a suppressed player never ends, so the test would measure nothing
          # while appearing to run. `stayon true` matters as much as the unlock: the build takes
          # minutes, and a screen that slept in the meantime puts the device right back in the
          # state the unlock was there to avoid. Animations off so Compose's idling resource is
          # not waiting on them.
          script: |
            adb shell input keyevent 82
            adb shell svc power stayon true
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            ./gradlew connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.notClass=com.dewijones92.totum.sabr.SabrPlaybackTest

      # The live-YouTube test, run through Dewi's home broadband so YouTube sees a residential
      # IP instead of bot-checking a datacentre one. Its own step, and the tunnel is up for the
      # duration of ONE test rather than the whole job: full-tunnel means the runner's traffic
      # to GitHub goes over a domestic upload too, which is fine for a minute and not for ten.
      #
      # The peer is firewalled to internet egress only on the Pi
      # (vpn-stack/wg-home-init/10-ci-peer-lockdown.sh) — wg-home clients normally get full LAN
      # access, and this key lives in a PUBLIC repo. `continue-on-error` because a home
      # connection is not a build dependency: if the tunnel cannot come up, that is worth seeing
      # and is not a reason to call the app broken.
      - name: Live YouTube test via home broadband
        continue-on-error: true
        env:
          WG_CI_CONF: ${{ secrets.WG_CI_CONF }}
          WG_EXPECTED_EGRESS_IP: ${{ secrets.WG_EXPECTED_EGRESS_IP }}
        run: |
          set -euo pipefail
          if [ -z "${WG_CI_CONF:-}" ]; then echo "no tunnel configured; skipping"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools
          printf '%s\n' "$WG_CI_CONF" | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          trap 'sudo wg-quick down wg0 || true' EXIT

          # Never print the IP: this repo is public, so its logs are. Compare, report a verdict.
          EGRESS=$(curl -s --max-time 20 https://api.ipify.org)
          if [ "$EGRESS" = "$WG_EXPECTED_EGRESS_IP" ]; then
            echo "egress is the expected residential IP"
          else
            echo "egress is NOT the expected IP — the tunnel is not carrying traffic"; exit 1
          fi

          # The lockdown is asserted, not assumed. A peer that can still see the LAN is the
          # whole risk of doing this at all, so the run fails rather than proceeding quietly.
          for TARGET in 192.168.0.1 192.168.0.19; do
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/$TARGET/80" 2>/dev/null; then
              echo "LAN host reachable through the CI peer — lockdown FAILED"; exit 1
            fi
          done
          echo "LAN unreachable from the CI peer, as intended"

          ./gradlew connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=com.dewijones92.totum.sabr.SabrPlaybackTest

      - name: Upload instrumented reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**

  build:
    name: Quality gates + build
    runs-on: ubuntu-latest
    permissions:
      contents: write # rolling 'latest' release
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Static analysis (detekt)
        run: ./gradlew detekt --no-daemon

      - name: Android Lint
        run: ./gradlew lint --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Coverage gate (logic modules)
        run: ./gradlew koverVerify --no-daemon

      # Instrumented tests need a device to RUN, but they compile without one — and until
      # 2026-08-01 nothing compiled them at all, so AppShellTest sat red for an unknown time
      # asserting a string the app had stopped showing. A test that cannot compile is worse
      # than absent: it looks like coverage.
      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: totum-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # ---- Rolling signed release of main's tip (for Obtainium) ----

      - name: Decode signing keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/totum-release.jks"

      - name: Assemble signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/totum-release.jks
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=$((100 + GITHUB_RUN_NUMBER)) \
            -PversionName="0.1.${GITHUB_RUN_NUMBER}" \
            -PgitSha="${GITHUB_SHA:0:7}"

      # A real tag per build, not a rolling one. Obtainium's default version string for a
      # GitHub source is the release TAG, so a permanently-fixed `latest` meant the
      # version never appeared to change and an update was only ever detected by
      # non-default settings. v0.1.<run> matches versionName exactly, so the tag, the
      # release title and the installed app all agree.
      - name: Publish versioned release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk totum.apk
          # Ship the R8 mapping with the build it belongs to: without it, a crash report
          # from this APK is a wall of one-letter class names (the trace carries a map id
          # to match against). Costs nothing and is useless if fetched later.
          cp app/build/outputs/mapping/release/mapping.txt totum-mapping.txt || true
          # Not a prerelease: it makes this the repo's "Latest release", so
          # /releases/latest/download/totum.apk stays a stable URL without a rolling tag,
          # and Obtainium needs nothing switched on to see it.
          gh release create "v0.1.${GITHUB_RUN_NUMBER}" totum.apk totum-mapping.txt \
            --target "${GITHUB_SHA}" \
            --title "Totum main tip (0.1.${GITHUB_RUN_NUMBER})" \
            --notes "Build of main at ${GITHUB_SHA}. Signed; safe to update over previous builds."

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            build/reports/
