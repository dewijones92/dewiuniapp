name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-sponsorblock:
    name: SponsorBlock removal (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg + yt-dlp
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python3 -m pip install "yt-dlp==2026.6.9"
      - name: Verify SponsorBlock segments are cut from downloads
        run: python3 tools/sponsorblock-verify/verify_sponsorblock_cut.py

  verify-mock-youtube:
    name: Mock YouTube replay (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install yt-dlp + mitmproxy (pinned to the cassette's recording versions)
        run: python3 -m pip install "yt-dlp==2026.6.9" "mitmproxy==12.2.2"
      - name: Replay cassette and verify offline extraction
        run: tools/mock-youtube/verify_replay.sh

  build:
    name: Quality gates + build
    runs-on: ubuntu-latest
    permissions:
      contents: write # rolling 'latest' release
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Static analysis (detekt)
        run: ./gradlew detekt --no-daemon

      - name: Android Lint
        run: ./gradlew lint --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Coverage gate (logic modules)
        run: ./gradlew koverVerify --no-daemon

      # Instrumented tests need a device to RUN, but they compile without one — and until
      # 2026-08-01 nothing compiled them at all, so AppShellTest sat red for an unknown time
      # asserting a string the app had stopped showing. A test that cannot compile is worse
      # than absent: it looks like coverage.
      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: totum-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # ---- Rolling signed release of main's tip (for Obtainium) ----

      - name: Decode signing keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/totum-release.jks"

      - name: Assemble signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/totum-release.jks
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=$((100 + GITHUB_RUN_NUMBER)) \
            -PversionName="0.1.${GITHUB_RUN_NUMBER}" \
            -PgitSha="${GITHUB_SHA:0:7}"

      # A real tag per build, not a rolling one. Obtainium's default version string for a
      # GitHub source is the release TAG, so a permanently-fixed `latest` meant the
      # version never appeared to change and an update was only ever detected by
      # non-default settings. v0.1.<run> matches versionName exactly, so the tag, the
      # release title and the installed app all agree.
      - name: Publish versioned release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk totum.apk
          # Ship the R8 mapping with the build it belongs to: without it, a crash report
          # from this APK is a wall of one-letter class names (the trace carries a map id
          # to match against). Costs nothing and is useless if fetched later.
          cp app/build/outputs/mapping/release/mapping.txt totum-mapping.txt || true
          # Not a prerelease: it makes this the repo's "Latest release", so
          # /releases/latest/download/totum.apk stays a stable URL without a rolling tag,
          # and Obtainium needs nothing switched on to see it.
          gh release create "v0.1.${GITHUB_RUN_NUMBER}" totum.apk totum-mapping.txt \
            --target "${GITHUB_SHA}" \
            --title "Totum main tip (0.1.${GITHUB_RUN_NUMBER})" \
            --notes "Build of main at ${GITHUB_SHA}. Signed; safe to update over previous builds."

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            build/reports/
